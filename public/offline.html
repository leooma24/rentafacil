<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - Renta Fácil</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f3f4f6; color: #374151; text-align: center; }
        .container { max-width: 400px; padding: 40px; }
        h1 { color: #06b6d4; font-size: 28px; }
        p { color: #6b7280; line-height: 1.6; }
        button { background: #06b6d4; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #0891b2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sin conexión</h1>
        <p>No tienes conexión a internet. Verifica tu conexión e intenta de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
